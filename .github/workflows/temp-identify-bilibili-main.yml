name: Temp identify Bilibili outro music

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/music-identify-trigger

permissions:
  contents: read

jobs:
  identify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          python -m pip install requests yt-dlp shazamio

      - name: Download, clip and identify
        shell: bash
        run: |
          cat > identify_music.py <<'PY'
          import asyncio
          import glob
          import json
          import os
          import subprocess
          import traceback
          from pathlib import Path

          import requests
          from shazamio import Shazam

          BVID = 'BV1bRgh6AEdB'
          PAGE = f'https://www.bilibili.com/video/{BVID}'
          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
              'Referer': PAGE,
              'Origin': 'https://www.bilibili.com',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          }
          diagnostic = []
          metadata = {}

          def log(message):
              print(message, flush=True)
              diagnostic.append(str(message))

          def download_bili_api():
              log('METHOD bili_api: requesting view metadata')
              r = requests.get('https://api.bilibili.com/x/web-interface/view', params={'bvid': BVID}, headers=HEADERS, timeout=30)
              log(f'view status={r.status_code} body={r.text[:300]}')
              r.raise_for_status()
              data = r.json()
              if data.get('code') != 0:
                  raise RuntimeError(f'view API error: {data}')
              info = data['data']
              metadata.update({k: info.get(k) for k in ['bvid','aid','title','desc','duration','pubdate','cid']})
              metadata['uploader'] = (info.get('owner') or {}).get('name')
              cid = info.get('cid') or info['pages'][0]['cid']

              log(f'METHOD bili_api: requesting playurl cid={cid}')
              p = requests.get(
                  'https://api.bilibili.com/x/player/playurl',
                  params={'bvid': BVID, 'cid': cid, 'fnval': 16, 'qn': 64, 'fourk': 1},
                  headers=HEADERS,
                  timeout=30,
              )
              log(f'playurl status={p.status_code} body={p.text[:500]}')
              p.raise_for_status()
              payload = p.json()
              if payload.get('code') != 0:
                  raise RuntimeError(f'playurl API error: {payload}')
              body = payload['data']
              audios = (body.get('dash') or {}).get('audio') or []
              if audios:
                  best = max(audios, key=lambda x: x.get('bandwidth') or 0)
                  url = best.get('baseUrl') or best.get('base_url')
                  out = Path('source_audio.m4s')
              else:
                  durls = body.get('durl') or []
                  if not durls:
                      raise RuntimeError('No audio or durl in playurl response')
                  url = durls[0]['url']
                  out = Path('source_video.flv')
              log(f'METHOD bili_api: downloading media from {url[:160]}')
              with requests.get(url, headers=HEADERS, stream=True, timeout=90) as media:
                  log(f'media status={media.status_code} headers={dict(list(media.headers.items())[:8])}')
                  media.raise_for_status()
                  with out.open('wb') as f:
                      for chunk in media.iter_content(1024 * 512):
                          if chunk:
                              f.write(chunk)
              if out.stat().st_size < 10000:
                  raise RuntimeError(f'Download too small: {out.stat().st_size}')
              return str(out)

          def download_ytdlp():
              log('METHOD yt_dlp: starting')
              cmd = [
                  'yt-dlp', '--no-playlist', '--no-progress', '--write-info-json',
                  '--add-header', f'Referer:{PAGE}',
                  '--add-header', f'User-Agent:{HEADERS["User-Agent"]}',
                  '-f', 'bestaudio/best', '-o', 'source_ytdlp.%(ext)s', PAGE,
              ]
              proc = subprocess.run(cmd, text=True, capture_output=True, timeout=180)
              log(f'yt-dlp rc={proc.returncode}\nSTDOUT:\n{proc.stdout[-3000:]}\nSTDERR:\n{proc.stderr[-5000:]}')
              if proc.returncode != 0:
                  raise RuntimeError('yt-dlp failed')
              files = [p for p in glob.glob('source_ytdlp.*') if not p.endswith('.json')]
              if not files:
                  raise RuntimeError('yt-dlp produced no media')
              info_files = glob.glob('source_ytdlp*.info.json')
              if info_files:
                  try:
                      raw = json.load(open(info_files[0], encoding='utf-8'))
                      metadata.update({k: raw.get(k) for k in ['id','title','description','duration','uploader','track','artist','creator','webpage_url']})
                  except Exception as exc:
                      log(f'yt-dlp metadata parse error: {exc!r}')
              return files[0]

          def download_squidtail():
              log('METHOD squidtail: requesting parser')
              endpoint = 'https://api.squidtail.com/bili2vrc/parse/'
              r = requests.get(endpoint, params={'bv': BVID, 'p': 1, 'format': 'mp4', 'otype': 'json'}, headers=HEADERS, timeout=45)
              log(f'squidtail status={r.status_code} body={r.text[:1000]}')
              r.raise_for_status()
              data = r.json()
              url = data.get('url')
              if not url:
                  raise RuntimeError(f'No URL in parser response: {data}')
              out = Path('source_parser.mp4')
              with requests.get(url, headers=HEADERS, stream=True, timeout=120) as media:
                  log(f'parser media status={media.status_code}')
                  media.raise_for_status()
                  with out.open('wb') as f:
                      for chunk in media.iter_content(1024 * 512):
                          if chunk:
                              f.write(chunk)
              return str(out)

          def get_duration(path):
              proc = subprocess.run([
                  'ffprobe', '-v', 'error', '-show_entries', 'format=duration',
                  '-of', 'default=noprint_wrappers=1:nokey=1', path
              ], text=True, capture_output=True, check=True)
              return float(proc.stdout.strip())

          def make_clips(source):
              duration = get_duration(source)
              metadata['probed_duration'] = duration
              log(f'source={source} duration={duration}')
              Path('clips').mkdir(exist_ok=True)
              lengths = [45, 35, 30, 25, 20, 15, 12, 10]
              clips = []
              for length in lengths:
                  start = max(0.0, duration - length)
                  out = f'clips/tail{length}.wav'
                  cmd = [
                      'ffmpeg', '-hide_banner', '-loglevel', 'error', '-y',
                      '-ss', f'{start:.3f}', '-i', source, '-t', str(length),
                      '-vn', '-ac', '1', '-ar', '44100', out,
                  ]
                  proc = subprocess.run(cmd, text=True, capture_output=True)
                  log(f'ffmpeg tail{length} rc={proc.returncode} stderr={proc.stderr[-1000:]}')
                  if proc.returncode == 0 and os.path.exists(out) and os.path.getsize(out) > 1000:
                      clips.append(out)
              if not clips:
                  raise RuntimeError('No clips produced')
              return clips

          async def recognize(clips):
              shazam = Shazam()
              results = []
              for clip in clips:
                  item = {'clip': clip}
                  for name in ('recognize', 'recognize_song'):
                      method = getattr(shazam, name, None)
                      if method is None:
                          continue
                      try:
                          response = await method(clip)
                          item['method'] = name
                          item['response'] = response
                          break
                      except Exception as exc:
                          item.setdefault('errors', []).append(f'{name}: {exc!r}')
                  track = (item.get('response') or {}).get('track') or {}
                  if track:
                      item['candidate'] = {
                          'title': track.get('title'),
                          'artist': track.get('subtitle'),
                          'shazam_url': track.get('url'),
                          'isrc': track.get('isrc'),
                          'genres': track.get('genres'),
                      }
                  log(f'recognition {clip}: {item.get("candidate") or item.get("errors") or "no match"}')
                  results.append(item)
              return results

          async def main():
              source = None
              methods = [download_bili_api, download_ytdlp, download_squidtail]
              download_errors = []
              for method in methods:
                  try:
                      source = method()
                      log(f'DOWNLOAD_SUCCESS {method.__name__}: {source}')
                      break
                  except Exception as exc:
                      err = f'{method.__name__}: {exc!r}\n{traceback.format_exc()}'
                      log(err)
                      download_errors.append(err)

              recognition = []
              if source:
                  try:
                      clips = make_clips(source)
                      recognition = await recognize(clips)
                  except Exception as exc:
                      log(f'clip/recognition error: {exc!r}\n{traceback.format_exc()}')

              candidates = [x['candidate'] | {'clip': x['clip']} for x in recognition if x.get('candidate')]
              result = {
                  'video': BVID,
                  'source': source,
                  'metadata': metadata,
                  'candidates': candidates,
                  'recognition': recognition,
                  'download_errors': download_errors,
                  'diagnostic': diagnostic,
              }
              with open('music-result.json', 'w', encoding='utf-8') as f:
                  json.dump(result, f, ensure_ascii=False, indent=2)
              print('MUSIC_RESULT_START')
              print(json.dumps(result, ensure_ascii=False, indent=2))
              print('MUSIC_RESULT_END')

          asyncio.run(main())
          PY

          set +e
          python identify_music.py 2>&1 | tee run.log
          echo "script_exit=${PIPESTATUS[0]}" | tee -a run.log
          test -f music-result.json || printf '{"error":"music-result.json was not produced"}\n' > music-result.json
          exit 0

      - name: Upload diagnostics and clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-result
          path: |
            music-result.json
            run.log
            clips/*.wav
          if-no-files-found: warn
          retention-days: 1
